name: Create new release

permissions:
  contents: write
  packages: write
  pull-requests: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            python-version: "3.14"
          - os: windows-latest
            label: windows  
            python-version: "3.14"
          - os: macos-latest
            label: macos-apple-silicon
            python-version: "3.14"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress --accept-license

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .[dev,opencl]  # the executables include the OpenCL SIFT

      - name: Build and package release
        run: |
          python scripts/build_release.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shinestacker-${{ matrix.label }}
          path: |
            ${{ matrix.os == 'windows-latest' && 'dist/shinestacker-*.zip' || '' }}
            ${{ matrix.os == 'windows-latest' && 'dist/shinestacker-*.exe' || '' }}
            ${{ matrix.os == 'ubuntu-latest' && 'dist/shinestacker-*.tar.gz' || '' }}
            ${{ contains(matrix.label, 'macos') && 'dist/shinestacker-*.dmg' || '' }}
          if-no-files-found: error

  create-release:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          python3 -c 'import shutil; shutil.make_archive("release_assets/amber-flies", "zip", "examples/input/amber-flies")'
          cp artifacts/shinestacker-*/* release_assets/
          echo "Available release assets:"
          ls -la release_assets/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release_assets/*
